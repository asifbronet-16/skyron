; PHP settings for the form handlers in this folder. PHP-FPM reads this file
; (changes can take up to 5 minutes to apply).

; The careers form takes a CV of up to 2.5MB (constants/careers.ts) plus the
; rest of the form; PHP's defaults (2M per file) would turn a 2.1-2.5MB CV away.
upload_max_filesize = 4M
post_max_size = 8M

; The handlers answer in JSON. A warning printed into the reply (e.g. PHP's own
; "POST Content-Length exceeds the limit") would break it, so log, don't show.
display_errors = Off
log_errors = On
